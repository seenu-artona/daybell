name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image-worker:
    # The image worker's Lambda zip (ADR 0016), built on every pull request so a broken bundle shows before deploying.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daybell/image-worker package
      - name: The zip holds the bundle, the font and sharp for Linux arm64
        run: |
          unzip -l apps/image-worker/image-worker.zip > /tmp/zip.txt
          grep -q ' lib/index.mjs$' /tmp/zip.txt
          grep -q ' assets/PlusJakartaSans-Bold.ttf$' /tmp/zip.txt
          grep -q 'node_modules/@img/sharp-linux-arm64/lib/.*\.node$' /tmp/zip.txt

  database:
    # Row-level security and cross-studio leak tests against the real Supabase Postgres (D96, D113).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.118.0
      - run: supabase db start --workdir packages/db
      - run: supabase test db --workdir packages/db

  e2e:
    # The Phase 0 "Done when" flow in a real browser, against a real local Supabase (D10).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.118.0
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (database, auth, email inbox)
        run: supabase start --workdir packages/db -x studio,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
      - name: Record the local database's region (Canada, D122)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -c "insert into app.config (key, value) values ('data_region', 'ca');"
      - name: Point the app at local Supabase
        run: |
          supabase status --workdir packages/db -o env > /tmp/sb.env
          . /tmp/sb.env
          echo "NEXT_PUBLIC_SUPABASE_URL_CA=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_CA=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          # Server-only code writes (ADR 0011): the local stack's service role key, printed by `supabase status`. Masked,
          # and never committed.
          secret_key="${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          test -n "$secret_key"
          echo "::add-mask::$secret_key"
          echo "SUPABASE_SECRET_KEY_CA=$secret_key" >> "$GITHUB_ENV"
          echo "SITE_URL=http://localhost:3000" >> "$GITHUB_ENV"
          # Photos (ADR 0016): the local storage driver, files under apps/web/.storage; previews are made in the app.
          echo "STORAGE_DRIVER=local" >> "$GITHUB_ENV"
          # Access code keys (ADR 0011): fresh random keys for each run's throwaway database, never committed.
          hmac_key="$(openssl rand -base64 32)"
          encryption_key="$(openssl rand -base64 32)"
          echo "::add-mask::$hmac_key"
          echo "::add-mask::$encryption_key"
          echo "ACCESS_CODE_HMAC_KEY=$hmac_key" >> "$GITHUB_ENV"
          echo "ACCESS_CODE_ENCRYPTION_KEY=$encryption_key" >> "$GITHUB_ENV"
          # Payouts (ADR 0020): the fake Stripe only (Claude's call Q12), no Stripe key in CI. A fresh random webhook
          # signing secret per run, which the fake signs its pretend events with; masked, never committed.
          echo "STRIPE_DRIVER=fake" >> "$GITHUB_ENV"
          webhook_secret="whsec_$(openssl rand -hex 24)"
          echo "::add-mask::$webhook_secret"
          echo "STRIPE_WEBHOOK_SECRET=$webhook_secret" >> "$GITHUB_ENV"
      # Build through Turborepo exactly as Vercel does, so undeclared settings fail here, not in previews.
      - run: pnpm turbo run build --filter=@daybell/web
      - run: pnpm --filter @daybell/web exec playwright install --with-deps chromium
      # Load tests (@load, e.g. the 5,000-row roster) run on pushes to main only, to keep pull requests quick (ADR 0013).
      - name: End-to-end tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm --filter @daybell/web e2e --grep-invert @load
          else
            pnpm --filter @daybell/web e2e
          fi
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
