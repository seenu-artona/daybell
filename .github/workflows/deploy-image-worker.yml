name: Deploy image worker (staging)

# Updates the staging image worker Lambda (ADR 0016; docs/aws-staging-photos.md). Run by hand from the Actions tab.
# The `staging` environment requires Seenu's approval and holds no secrets: GitHub's OIDC token is exchanged for a role
# that may only update this one function's code. Production is deployed by Seenu alone (CLAUDE.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-image-worker-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      FUNCTION_NAME: daybell-staging-ca-image-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daybell/image-worker test
      - name: Build the Lambda zip (sharp for Linux arm64)
        run: pnpm --filter @daybell/image-worker package
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # An environment variable (not a secret): the role's ARN, e.g. arn:aws:iam::<account>:role/daybell-staging-github-image-worker-deploy
          role-to-assume: ${{ vars.AWS_IMAGE_WORKER_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Update the function's code
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --zip-file fileb://apps/image-worker/image-worker.zip --output text --query 'CodeSha256'
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
