name: Staging photo clean-up

# The daily photo clean-up for staging (ADR 0016; docs/aws-staging-photos.md): Vercel Cron only runs for production
# deployments, so GitHub calls staging's cron route instead. It purges photos binned more than 30 days ago, drops
# uploads never finished after 7 days and finishes idle batches. The secrets live in GitHub only; the response is
# counts, never personal data.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: staging-photo-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call staging's clean-up
        env:
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          BYPASS: ${{ secrets.STAGING_VERCEL_PROTECTION_BYPASS }}
        run: |
          test -n "$CRON_SECRET"
          bypass=()
          if [ -n "$BYPASS" ]; then bypass=(-H "x-vercel-protection-bypass: $BYPASS"); fi
          curl --fail-with-body --silent --show-error --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" "${bypass[@]}" \
            https://daybell-git-main-artona-tech-team.vercel.app/api/v1/internal/cron/photos
